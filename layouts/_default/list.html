{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ if .Pages }}
<ul class="post-list">
  {{ range .Pages }}
  <li>
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
    </p>
    <h2 class="post-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
    {{ if .Summary }}
    <p>{{ .Summary }}</p>
    {{ end }}
  </li>
  {{ end }}
</ul>
{{ end }}
{{ end }}
