[params]
description = "Controls Engineer specializing in robotics, control systems, and reinforcement learning"
author = "Prem Chand"
email = "premc946@gmail.com"
github = "prem-chand"
twitter = "prem_chand17"
linkedin = "premchand17"
role = "Controls Engineer"
company = "Strider Robotics"
location = "Bengaluru, India"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    style = "monokai"
    lineNos = false
    noClasses = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[taxonomies]
  tag = "tags"
  category = "categories"

